<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Common Ground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><style>circle{fill:%23111}@media(prefers-color-scheme:dark){circle{fill:%23fff}}</style><circle cx='32' cy='32' r='30'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--red:#d7141a;--ink:#111;--mute:#707070;--line:#e7e7e7;--serif:'Source Serif 4',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{padding-top:28px}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:10px}
h1{margin:0;font-weight:900;font-size:clamp(36px,6vw,58px);letter-spacing:-.025em;line-height:1}
h1 i{font-style:normal;color:var(--red)}
.dateline{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.09em}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.lbl{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
input[type=number],input[type=search]{width:62px;font:inherit;padding:5px 8px;border:1px solid #ccc;border-radius:4px}
input[type=search]{width:170px}
input[type=number]:focus,input[type=search]:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
button{font:500 13px Roboto,sans-serif;text-transform:uppercase;letter-spacing:.06em;background:var(--red);color:#fff;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
button:hover{background:#b00f14}
button:disabled{opacity:.6;cursor:wait}
.link{background:none;color:var(--mute);padding:0;font-size:12px;text-transform:none;letter-spacing:0;text-decoration:underline}
.link:hover{background:none;color:var(--red)}
.tsw{display:flex;flex-direction:column;width:150px}
.tsw input{accent-color:var(--red);width:100%;margin:0;cursor:pointer}
.tsw .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.tsw .ticks span{cursor:pointer}
.tsw .ticks span.on{color:var(--red);font-weight:700}
.count{font-size:12px;color:var(--mute);white-space:nowrap}
.count b{color:var(--ink);font-weight:700}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;max-width:1200px;margin:0 auto;padding:22px 16px 60px}
@media(max-width:880px){main{grid-template-columns:1fr}}
@media(max-width:880px){
  section h2{cursor:pointer;display:flex;align-items:center;gap:8px;padding-top:10px;user-select:none;-webkit-tap-highlight-color:transparent}
  section h2::before{content:"";border:6px solid transparent;border-top:8px solid var(--red);border-bottom:0;transition:transform .15s}
  section.closed h2::before{transform:rotate(-90deg)}
  section.closed>:not(h2){display:none}
  section.closed h2{margin-bottom:18px}
}
@media(max-width:600px){.bar .grp:first-child{width:100%}input[type=search]{flex:1 1 100%;width:auto}}
section h2{margin:0 0 4px;padding-top:8px;border-top:4px solid var(--red);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
section h2 small{font-weight:400;color:var(--mute);letter-spacing:.04em;margin-left:6px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:14px 0 14px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:0;top:12px;color:var(--red);font-weight:300;font-size:22px;line-height:1}
details[open] summary::after{content:"−"}
.meta{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.meta .tm{color:var(--red);font-weight:700;margin-left:8px}
h3{margin:3px 26px 4px 0;font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.005em}
summary:hover h3{color:var(--red)}
.dek{margin:0 26px 0 0;font:400 17px/1.45 var(--serif);color:#333}
details.seen h3{color:var(--mute)}
details.seen .meta::before{content:"● ";color:var(--red)}
.body{padding:0 0 18px}
.body img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-bottom:12px;background:#f2f2f2}
.body p{margin:0 0 .9em;font:400 18px/1.55 var(--serif);color:#121212}
.body a{color:var(--red);font-weight:500;font-size:13px;text-decoration:none;text-transform:uppercase;letter-spacing:.06em}
.links{display:flex;flex-wrap:wrap;gap:8px 22px}
.cm-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin:6px 0 12px}
.cm{border-left:3px solid var(--line);padding:0 0 0 12px;margin:0 0 16px}
.cm-meta{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.body .cm p{font-size:16px;margin:0 0 .5em}
mark{background:#fde2e3;color:inherit;padding:0 1px;border-radius:2px}
.empty{color:var(--mute);font-size:14px;padding:14px 0}
.status{padding:40px 16px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header class="wrap">
  <div class="mast">
    <h1>Common<i>.</i>Ground</h1>
    <div class="dateline" id="dateline"></div>
  </div>
  <div class="bar">
    <div class="grp">
      <input id="q" type="search" placeholder="Search…" aria-label="Search articles" autocomplete="off">
      <span class="lbl">Articles</span>
      <input id="n" type="number" min="3" max="60" step="1" value="9">
      <button id="go">Re-search</button>
      <button class="link" id="reset" title="Unmute all read articles">reset read</button>
    </div>
    <div class="grp">
      <div class="tsw">
        <input id="t" type="range" min="0" max="2" step="1" value="0" aria-label="Trump filter">
        <div class="ticks"><span data-v="0">T-off</span><span data-v="1">T-mid</span><span data-v="2">T-on</span></div>
      </div>
      <span class="count" id="count"></span>
    </div>
  </div>
</header>
<main id="main"><div class="status">Loading…</div></main>

<script>
const SOURCES = [['Guardian','The Guardian'],['BBC','BBC News'],['Reddit','r/worldnews']];
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem('cg.'+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('cg.'+k, JSON.stringify(v)); } catch {} }
};
let data = [], updated = null;
const muted = new Set(store.get('muted', []));
const opened = new Set(store.get('opened', []));
const closed = new Set(store.get('closed', []));
const mobile = matchMedia('(max-width:880px)');
$('n').value = store.get('n', 9);
$('t').value = store.get('t', 0);

function save(){
  store.set('muted', [...muted].slice(-3000));
  store.set('opened', [...opened]);
  store.set('closed', [...closed]);
  store.set('n', +$('n').value);
  store.set('t', +$('t').value);
}

// 0 = no Trump; 1 = passing mention in body only; 2 = in headline/standfirst or a main focus
function trumpLevel(a){
  if (a._t != null) return a._t;
  const re = /\btrump/gi;
  const n = ([...a.body, ...(a.comments || []).map(c => c.body.join(' '))].join(' ').match(re) || []).length;
  let lvl = 0;
  if (re.test(a.title + ' ' + (a.summary || ''))) lvl = 2;
  else if (n > 3 || /\btrump/i.test(a.body[0] || '')) lvl = 2;
  else if (n) lvl = 1;
  return a._t = lvl;
}

function ago(iso){
  const m = (Date.now() - new Date(iso)) / 6e4;
  if (!iso || isNaN(m)) return '';
  if (m < 60) return Math.max(1, Math.round(m)) + 'm ago';
  if (m < 1440) return Math.round(m / 60) + 'h ago';
  return Math.round(m / 1440) + 'd ago';
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

const fmtK = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n ?? 0);
const paras = (list, terms, into) => list.forEach(t => { const p = el('p'); p.append(hl(t, terms)); into.append(p); });
function link(text, href){ const a = el('a', '', text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a; }

function hl(text, terms){
  const f = document.createDocumentFragment();
  if (!terms.length) { f.append(text); return f; }
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  text.split(re).forEach((part, i) => f.append(i % 2 ? el('mark', '', part) : part));
  return f;
}

function article(a, terms){
  const d = el('details');
  if (opened.has(a.url)) d.classList.add('seen');
  const s = el('summary');
  const meta = el('div', 'meta', a.source === 'Reddit'
    ? [a.domain || 'self post', fmtK(a.score) + ' ↑', fmtK(a.ncomments) + ' comments'].filter(Boolean).join(' · ')
    : a.source + (a.region === 'UK' ? ' · UK' : ''));
  meta.append(el('span', 'tm', ago(a.date)));
  const h = el('h3'); h.append(hl(a.title, terms));
  s.append(meta, h);
  if (a.summary) { const p = el('p', 'dek'); p.append(hl(a.summary, terms)); s.append(p); }
  d.append(s);
  d.addEventListener('toggle', () => {
    if (!d.open) return;
    if (!d.querySelector('.body')) {
      const b = el('div', 'body');
      if (a.image) {
        const img = el('img');
        img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.alt = '';
        img.onerror = () => img.remove();
        img.src = a.image;
        b.append(img);
      }
      paras(a.body, terms, b);
      const links = el('div', 'links');
      if (a.source === 'Reddit') {
        if (a.comments?.length) {
          b.append(el('div', 'cm-h', 'Top comments'));
          a.comments.forEach(c => {
            const cm = el('div', 'cm');
            cm.append(el('div', 'cm-meta', `u/${c.author} · ${fmtK(c.score)} ↑`));
            paras(c.body, terms, cm);
            b.append(cm);
          });
        }
        if (a.link) links.append(link('Read at ' + a.domain + ' →', a.link));
        links.append(link('Open comments →', a.url));
      } else {
        links.append(link('Read at ' + a.source + ' →', a.url));
      }
      b.append(links);
      d.append(b);
    }
    if (!opened.has(a.url)) { opened.add(a.url); d.classList.add('seen'); save(); }
  });
  return d;
}

// UK stories first, then world; newest first within each
// (Reddit keeps its own front-page order)
const ukFirst = (x, y) => ((y.region === 'UK') - (x.region === 'UK')) || (x.source === 'Reddit' ? 0 : new Date(y.date) - new Date(x.date));

function render(){
  const total = Math.max(1, Math.min(60, Math.round(+$('n').value) || 9));
  const mode = +$('t').value;
  const terms = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  document.querySelectorAll('.ticks span').forEach(s => s.classList.toggle('on', +s.dataset.v === mode));
  const base = Math.floor(total / 3), extra = total % 3;
  let tMuted = 0, rMuted = 0;
  const cols = SOURCES.map(([key, name], i) => {
    const pool = data.filter(a => a.source === key);
    const unread = pool.filter(a => !muted.has(a.url));
    rMuted += pool.length - unread.length;
    const pass = unread.filter(a => trumpLevel(a) <= mode).sort(ukFirst);
    tMuted += unread.length - pass.length;
    return { key, name, pool, pass, want: base + (i < extra ? 1 : 0) };
  });

  // Searching: take the newest `total` matches from all sources, then show each in its own column
  let hits = [];
  if (terms.length) {
    const text = a => a._s ??= [a.title, a.summary, a.domain, ...a.body, ...(a.comments || []).map(c => c.body.join(' '))].join(' ').toLowerCase();
    hits = cols.flatMap(c => c.pass).filter(a => terms.every(t => text(a).includes(t)));
    const top = new Set([...hits].sort((x, y) => new Date(y.date) - new Date(x.date)).slice(0, total));
    cols.forEach(c => { c.matches = c.pass.filter(a => hits.includes(a)).length; c.shown = c.pass.filter(a => top.has(a)); });
  } else {
    cols.forEach(c => c.shown = c.pass.slice(0, c.want));
  }

  const main = $('main');
  main.replaceChildren();
  cols.forEach(c => {
    const sec = el('section');
    sec.classList.toggle('closed', closed.has(c.key));
    const h = el('h2', '', c.name);
    h.onclick = () => {
      if (!mobile.matches) return;
      closed.has(c.key) ? closed.delete(c.key) : closed.add(c.key);
      sec.classList.toggle('closed', closed.has(c.key)); save();
    };
    const extraN = terms.length ? c.matches : c.pass.length - c.want;
    h.append(el('small', '', terms.length ? `${c.matches} match${c.matches === 1 ? '' : 'es'}` : extraN > 0 ? extraN + ' queued' : ''));
    sec.append(h);
    c.shown.forEach(a => sec.append(article(a, terms)));
    if (!c.shown.length && (c.want || terms.length)) sec.append(el('div', 'empty',
      terms.length ? (c.matches ? 'More matches here — raise the article count.' : 'No matches.')
      : !c.pool.length ? `Couldn’t fetch ${c.name} on the last update — it’ll retry within 30 minutes.`
      : 'All read or filtered — loosen the T filter, reset read, or wait for the next update.'));
    main.append(sec);
  });
  const c = $('count');
  c.innerHTML = (terms.length ? `<b>${hits.length}</b> found · ` : '') + `<b>${tMuted}</b> T-muted · <b>${rMuted}</b> read`;
  c.title = `${tMuted} hidden by the Trump filter, ${rMuted} read and muted`;
}

async function load(){
  try {
    const r = await fetch('news.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    data = j.articles || [];
    updated = j.updated;
  } catch (e) {
    if (!data.length) { $('main').innerHTML = '<div class="status">No news.json yet — run the “Fetch news” workflow once in the repo’s Actions tab.</div>'; return; }
  }
  const now = new Date();
  $('dateline').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    + (updated ? ' · Updated ' + new Date(updated).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '');
  render();
}

$('go').onclick = async () => {
  const btn = $('go');
  btn.disabled = true; btn.textContent = 'Scanning…';
  opened.forEach(u => muted.add(u));
  opened.clear(); save();
  await load();
  btn.disabled = false; btn.textContent = 'Re-search';
};
$('reset').onclick = () => { muted.clear(); opened.clear(); save(); render(); };
$('q').addEventListener('input', render);
$('n').addEventListener('change', () => { save(); render(); });
$('t').addEventListener('input', () => { save(); render(); });
document.querySelectorAll('.ticks span').forEach(s => s.onclick = () => { $('t').value = s.dataset.v; save(); render(); });

load();
</script>
</body>
</html>
